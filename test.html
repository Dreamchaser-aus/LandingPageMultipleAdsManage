<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引流追踪 API 测试页面</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
      background-color: #f9f9f9;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: #2c3e50; font-size: 1.2rem; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #0070f3;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    button:hover { background-color: #0051a2; }
    button.btn-secondary { background-color: #10b981; }
    button.btn-secondary:hover { background-color: #059669; }
    #log {
      background: #1e1e1e;
      color: #00ff66;
      padding: 15px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 250px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>🚀 引流追踪测试控制台</h1>

  <div class="card">
    <h2>1. 配置你的 Railway 部署地址</h2>
    <label for="apiUrl">Railway API Base URL (不要带末尾斜杠):</label>
    <input type="text" id="apiUrl" placeholder="https://xxxx.up.railway.app" value="">
  </div>

  <div class="card">
    <h2>2. 当前识别的推广参数</h2>
    <p><strong>utm_source (渠道):</strong> <span id="paramSource">无 (默认为 organic)</span></p>
    <p><strong>utm_campaign (活动/广告计划):</strong> <span id="paramCampaign">无 (默认为 none)</span></p>
  </div>

  <div class="card">
    <h2>3. 测试操作</h2>
    <button onclick="sendViewTrack()">手动触发 浏览事件 (/track/view)</button>
    <button class="btn-secondary" onclick="sendLeadTrack()">模拟表单提交 / 转化 (/track/lead)</button>
    <button style="background-color: #8b5cf6;" onclick="fetchStats()">查看所有渠道统计 (/api/stats)</button>
  </div>

  <div class="card">
    <h2>控制台日志 (Response Log)</h2>
    <div id="log">等待操作中...</div>
  </div>

  <script>
    // 日志输出函数
    function printLog(msg, data = '') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const content = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
      logDiv.innerHTML = `[${time}] ${msg}\n${content}\n------------------------\n` + logDiv.innerHTML;
    }

    // 1. 获取 URL 中的 UTM 参数
    function getUTMParams() {
      const urlParams = new URLSearchParams(window.location.search);
      return {
        source: urlParams.get('utm_source') || 'organic',
        campaign: urlParams.get('utm_campaign') || 'none'
      };
    }

    // 初始化页面逻辑
    const params = getUTMParams();
    document.getElementById('paramSource').innerText = params.source;
    document.getElementById('paramCampaign').innerText = params.campaign;

    // 获取并校验全局配置的 API URL
    function getApiBaseUrl() {
      const url = document.getElementById('apiUrl').value.trim();
      if (!url) {
        alert('请先填写你的 Railway 域名地址！');
        return null;
      }
      return url.replace(/\/+$/, ""); // 移除末尾斜杠
    }

    // 2. 发送浏览打点 (PV)
    async function sendViewTrack() {
      const baseUrl = getApiBaseUrl();
      if (!baseUrl) return;

      printLog('正在发送 [View] 事件请求...');
      try {
        const response = await fetch(`${baseUrl}/track/view`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            website_domain: window.location.hostname || 'localhost-test',
            source: params.source,
            campaign: params.campaign,
            user_agent: navigator.userAgent
          })
        });
        const result = await response.json();
        printLog('✅ [View] 请求成功返回:', result);
      } catch (error) {
        printLog('❌ [View] 请求失败:', error.message);
      }
    }

    // 3. 发送转化打点 (Lead)
    async function sendLeadTrack() {
      const baseUrl = getApiBaseUrl();
      if (!baseUrl) return;

      printLog('正在发送 [Lead] 转化事件请求...');
      try {
        const response = await fetch(`${baseUrl}/track/lead`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            website_domain: window.location.hostname || 'localhost-test',
            source: params.source,
            campaign: params.campaign,
            user_agent: navigator.userAgent
          })
        });
        const result = await response.json();
        printLog('🎯 [Lead] 请求成功返回:', result);
      } catch (error) {
        printLog('❌ [Lead] 请求失败:', error.message);
      }
    }

    // 4. 获取数据库统计报表
    async function fetchStats() {
      const baseUrl = getApiBaseUrl();
      if (!baseUrl) return;

      printLog('正在获取 API 统计数据...');
      try {
        const response = await fetch(`${baseUrl}/api/stats`);
        const result = await response.json();
        printLog('📊 数据统计结果:', result);
      } catch (error) {
        printLog('❌ 获取统计失败:', error.message);
      }
    }

    // 页面加载完成后自动发一次 View 打点测试 (仅当配置了 API URL 时)
    window.addEventListener('load', () => {
      printLog('页面已初始化。请在上方输入框填入 Railway API 域名后开始测试。');
    });
  </script>
</body>
</html>

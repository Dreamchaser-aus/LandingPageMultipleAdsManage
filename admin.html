<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多站点渠道引流管理后台</title>
  <!-- 引入 Tailwind CSS CDN 用于精美布局 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

  <!-- 顶部导航 -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-900 flex items-center">
        📊 多渠道引流效果分析系统
      </h1>
      <div class="flex items-center space-x-2">
        <span class="text-sm text-gray-500">Railway 接口地址:</span>
        <input type="text" id="apiBaseUrl" class="border border-gray-300 rounded px-2 py-1 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://xxx.up.railway.app">
        <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1 rounded font-medium transition">刷新数据</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    
    <!-- 第一部分：推广链接生成器 (Link Builder) -->
    <section class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">🔗 推广链接生成器 (多站点/多渠道)</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">落地页实际网址 (Domain)</label>
          <input type="text" id="targetDomain" placeholder="例如: https://mysite1.com" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">引流渠道 (utm_source)</label>
          <select id="linkSource" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="tiktok">TikTok (抖音海外版)</option>
            <option value="facebook">Facebook Ads</option>
            <option value="google">Google Ads</option>
            <option value="xiaohongshu">小红书</option>
            <option value="instagram">Instagram</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">广告计划/活动 (utm_campaign)</label>
          <input type="text" id="linkCampaign" placeholder="例如: 2026_summer_sale" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>
      <button onclick="generateLink()" class="bg-gray-900 hover:bg-gray-800 text-white px-4 py-2 rounded text-sm font-medium transition">生成推广链接</button>
      
      <!-- 生成结果展示 -->
      <div id="resultBox" class="mt-4 hidden p-3 bg-gray-50 border border-gray-200 rounded flex justify-between items-center">
        <span id="generatedUrl" class="text-sm font-mono text-blue-600 break-all select-all"></span>
        <button onclick="copyLink()" class="text-xs bg-white border border-gray-300 px-2 py-1 rounded hover:bg-gray-100 ml-2 shrink-0">复制</button>
      </div>
    </section>

    <!-- 第二部分：多站点效果分类看板 (Analytics) -->
    <section class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-gray-900">📈 多渠道引流 ROI 效果报表</h2>
        <span class="text-xs text-gray-400">自动根据域名与渠道分类统计</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-gray-200 bg-gray-50 text-xs font-semibold uppercase text-gray-500 tracking-wider">
              <th class="py-3 px-4">目标站点 (Domain)</th>
              <th class="py-3 px-4">引流渠道 (Source)</th>
              <th class="py-3 px-4">独立访问量 (Views / PV)</th>
              <th class="py-3 px-4">留资/转化量 (Leads)</th>
              <th class="py-3 px-4">综合转化率 (CVR)</th>
            </tr>
          </thead>
          <tbody id="statsTableBody" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="5" class="py-8 text-center text-gray-400">请先在顶部配置 Railway 地址并点击刷新数据...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // 从 localStorage 自动读取之前配置过的 Railway 地址，方便使用
    document.getElementById('apiBaseUrl').value = localStorage.getItem('rw_api_url') || '';

    // 1. 生成推广短链
    function generateLink() {
      let domain = document.getElementById('targetDomain').value.trim();
      const source = document.getElementById('linkSource').value;
      const campaign = document.getElementById('linkCampaign').value.trim() || 'none';

      if (!domain) {
        alert('请输入你的落地页实际网址！');
        return;
      }
      
      // 规范化域名格式
      if (!/^https?:\/\//i.test(domain)) {
        domain = 'https://' + domain;
      }

      const finalUrl = `${domain}/?utm_source=${source}&utm_campaign=${campaign}`;
      document.getElementById('generatedUrl').innerText = finalUrl;
      document.getElementById('resultBox').classList.remove('hidden');
    }

    function copyLink() {
      const text = document.getElementById('generatedUrl').innerText;
      navigator.clipboard.writeText(text).then(() => alert('链接已复制到剪贴板！'));
    }

    // 2. 从 Railway 后端拉取多站点渠道统计数据
    async function refreshData() {
      let baseUrl = document.getElementById('apiBaseUrl').value.trim();
      if (!baseUrl) {
        alert('请先填写 Railway 接口地址！');
        return;
      }
      baseUrl = baseUrl.replace(/\/+$/, "");
      localStorage.setItem('rw_api_url', baseUrl); // 记住地址

      const tbody = document.getElementById('statsTableBody');
      tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-500">正在从 Railway 加载最新转化数据...</td></tr>`;

      try {
        const response = await fetch(`${baseUrl}/api/stats`);
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          tbody.innerHTML = '';
          result.data.forEach(row => {
            const views = parseInt(row.views || 0);
            const leads = parseInt(row.leads || 0);
            // 计算转化率
            const cvr = views > 0 ? ((leads / views) * 100).toFixed(2) + '%' : '0.00%';

            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition";
            tr.innerHTML = `
              <td class="py-3 px-4 font-medium text-gray-900">${row.domain}</td>
              <td class="py-3 px-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">${row.source}</span></td>
              <td class="py-3 px-4 text-gray-600">${views}</td>
              <td class="py-3 px-4 text-gray-600 font-semibold">${leads}</td>
              <td class="py-3 px-4 text-green-600 font-medium">${cvr}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-400">暂无引流数据，快去生成链接推广吧！</td></tr>`;
        }
      } catch (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-500 font-medium">连接 Railway 失败，请检查 API 地址是否正确或是否允许跨域。</td></tr>`;
      }
    }
  </script>
</body>
</html>

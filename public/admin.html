<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引流效果管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- 头部 -->
    <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">多渠道引流数据后台</h1>
        <p class="text-slate-500 text-sm mt-1">支持多站点流量监测与 ROI 效果分析</p>
      </div>
      <button onclick="fetchAllData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">刷新所有数据</button>
    </header>

    <!-- 1. 落地页展示站点管理 (Logo 与 链接) -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
      <h2 class="text-lg font-bold mb-4 text-slate-900">🌐 落地页展示站点管理 (Logo与链接)</h2>
      
      <!-- 表单：新增 / 修改站点 -->
      <form id="websiteForm" onsubmit="handleWebsiteSubmit(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
        <input type="hidden" id="editSiteId">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">站点名称</label>
          <input type="text" id="siteName" required placeholder="如：官方商城" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">副标题/描述</label>
          <input type="text" id="siteDesc" placeholder="如：限时折扣领券中心" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">跳转 URL</label>
          <input type="url" id="siteUrl" required placeholder="https://..." class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Logo图片URL</label>
          <input type="url" id="siteIcon" placeholder="https://.../logo.png" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="flex items-end gap-2">
          <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium transition">添加站点</button>
          <button type="button" id="cancelBtn" onclick="resetWebsiteForm()" class="hidden bg-slate-300 hover:bg-slate-400 text-slate-700 py-2 px-3 rounded-lg text-sm transition">取消</button>
        </div>
      </form>

      <!-- 站点列表表格 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
              <th class="p-3">Logo</th>
              <th class="p-3">站点名称</th>
              <th class="p-3">描述</th>
              <th class="p-3">目标链接</th>
              <th class="p-3">操作</th>
            </tr>
          </thead>
          <tbody id="websiteManageTable" class="divide-y divide-slate-100 text-sm">
            <tr><td colspan="5" class="p-4 text-center text-slate-400">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. 下方双列布局 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- 左侧：推广链接生成器 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-fit">
        <h2 class="text-lg font-bold mb-4 text-slate-900">🔗 推广链接生成器</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">引流目标落地页</label>
            <input type="text" id="targetUrl" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">引流渠道 (utm_source)</label>
            <select id="channelSelect" class="w-full px-3 py-2 border rounded-lg text-sm">
              <option value="tiktok">TikTok 抖音</option>
              <option value="xiaohongshu">小红书</option>
              <option value="google_ads">Google 广告</option>
              <option value="facebook">Facebook</option>
              <option value="wechat">微信公众号/群</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">活动名称 (utm_campaign)</label>
            <input type="text" id="campaignInput" placeholder="2026_promo" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <button onclick="generateAndSaveLink()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg text-sm font-medium transition">生成并保存链接</button>
        </div>
      </div>

      <!-- 右侧：数据报表 & 历史链接表 -->
      <div class="lg:col-span-2 space-y-8">
        
        <!-- 渠道转化数据明细 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
          <h2 class="text-lg font-bold mb-4 text-slate-900">📊 渠道转化数据明细</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                  <th class="p-3">目标域名</th>
                  <th class="p-3">引流渠道</th>
                  <th class="p-3">浏览量 (PV)</th>
                  <th class="p-3">转化量 (Leads)</th>
                </tr>
              </thead>
              <tbody id="statsTable" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="4" class="p-4 text-center text-slate-400">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 已生成的推广链接历史 (补齐) -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
          <h2 class="text-lg font-bold mb-4 text-slate-900">📋 已生成的推广链接历史</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                  <th class="p-3">渠道</th>
                  <th class="p-3">活动名</th>
                  <th class="p-3">完整链接</th>
                  <th class="p-3">操作</th>
                </tr>
              </thead>
              <tbody id="linksTable" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="4" class="p-4 text-center text-slate-400">暂无历史链接记录</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const baseUrl = window.location.origin;
    let websitesData = [];

    window.onload = () => {
      document.getElementById('targetUrl').value = baseUrl;
      fetchAllData();
    };

    function fetchAllData() {
      fetchManageWebsites();
      fetchStats();
      fetchLinksHistory(); // 恢复：获取历史链接
    }

    // ----------------- 1. 落地页站点管理 -----------------
    async function fetchManageWebsites() {
      try {
        const res = await fetch(`${baseUrl}/api/websites`);
        const json = await res.json();
        if (json.success) {
          websitesData = json.data;
          renderManageWebsitesTable(json.data);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderManageWebsitesTable(data) {
      const tbody = document.getElementById('websiteManageTable');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">尚未配置站点，请在上方添加</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(site => `
        <tr class="hover:bg-slate-50">
          <td class="p-3">
            <img src="${site.icon_url || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + site.id}" class="w-8 h-8 rounded-lg object-cover bg-slate-100">
          </td>
          <td class="p-3 font-semibold text-slate-800">${site.name}</td>
          <td class="p-3 text-xs text-slate-500">${site.desc_text || '-'}</td>
          <td class="p-3 text-xs text-blue-600 max-w-xs truncate"><a href="${site.url}" target="_blank">${site.url}</a></td>
          <td class="p-3 space-x-2">
            <button onclick="editSite(${site.id})" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded">修改</button>
            <button onclick="deleteSite(${site.id})" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded">删除</button>
          </td>
        </tr>
      `).join('');
    }

    async function handleWebsiteSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('editSiteId').value;
      const name = document.getElementById('siteName').value.trim();
      const desc_text = document.getElementById('siteDesc').value.trim();
      const url = document.getElementById('siteUrl').value.trim();
      const icon_url = document.getElementById('siteIcon').value.trim();

      const method = id ? 'PUT' : 'POST';
      const apiUrl = id ? `${baseUrl}/api/websites/${id}` : `${baseUrl}/api/websites`;

      try {
        const res = await fetch(apiUrl, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, desc_text, url, icon_url })
        });
        const json = await res.json();
        if (json.success) {
          resetWebsiteForm();
          fetchManageWebsites();
        }
      } catch (err) {
        alert('操作失败');
      }
    }

    function editSite(id) {
      const site = websitesData.find(s => s.id === id);
      if (!site) return;
      document.getElementById('editSiteId').value = site.id;
      document.getElementById('siteName').value = site.name;
      document.getElementById('siteDesc').value = site.desc_text || '';
      document.getElementById('siteUrl').value = site.url;
      document.getElementById('siteIcon').value = site.icon_url || '';

      document.getElementById('submitBtn').innerText = '保存修改';
      document.getElementById('submitBtn').className = 'w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition';
      document.getElementById('cancelBtn').classList.remove('hidden');
    }

    function resetWebsiteForm() {
      document.getElementById('websiteForm').reset();
      document.getElementById('editSiteId').value = '';
      document.getElementById('submitBtn').innerText = '添加站点';
      document.getElementById('submitBtn').className = 'w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium transition';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    async function deleteSite(id) {
      if (!confirm('确定要删除这个站点吗？')) return;
      try {
        await fetch(`${baseUrl}/api/websites/${id}`, { method: 'DELETE' });
        fetchManageWebsites();
      } catch (err) {
        alert('删除失败');
      }
    }

    // ----------------- 2. 数据报表 -----------------
    async function fetchStats() {
      try {
        const res = await fetch(`${baseUrl}/api/stats`);
        const json = await res.json();
        if (json.success) {
          const tbody = document.getElementById('statsTable');
          if (!json.data || json.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400">暂无引流数据</td></tr>';
            return;
          }
          tbody.innerHTML = json.data.map(row => `
            <tr class="hover:bg-slate-50">
              <td class="p-3 font-medium text-slate-800">${row.domain}</td>
              <td class="p-3"><span class="px-2 py-0.5 bg-blue-50 text-blue-600 rounded text-xs font-semibold">${row.source}</span></td>
              <td class="p-3 text-slate-600">${row.views}</td>
              <td class="p-3 font-semibold text-emerald-600">${row.leads}</td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }

    // ----------------- 3. 生成并展示推广链接历史 (补齐) -----------------
    async function generateAndSaveLink() {
      const targetUrl = document.getElementById('targetUrl').value.trim();
      const channel = document.getElementById('channelSelect').value;
      const campaign = document.getElementById('campaignInput').value.trim() || 'default';

      if (!targetUrl) return alert('请输入目标落地页 URL');

      try {
        const urlObj = new URL(targetUrl);
        urlObj.searchParams.set('utm_source', channel);
        urlObj.searchParams.set('utm_campaign', campaign);
        const fullLink = urlObj.toString();

        const res = await fetch(`${baseUrl}/api/links`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            target_url: targetUrl,
            source: channel,
            campaign: campaign,
            full_link: fullLink
          })
        });

        const json = await res.json();
        if (json.success) {
          fetchLinksHistory(); // 重新加载历史表格
          alert('链接已成功生成并保存到历史列表！');
        }
      } catch (err) {
        alert('链接格式不正确，请填写包含 https:// 的完整网址');
      }
    }

    async function fetchLinksHistory() {
      try {
        const res = await fetch(`${baseUrl}/api/links`);
        const json = await res.json();
        if (json.success) {
          renderLinksTable(json.data);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderLinksTable(data) {
      const tbody = document.getElementById('linksTable');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400">尚未生成过链接</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-50">
          <td class="p-3"><span class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs font-semibold">${row.source}</span></td>
          <td class="p-3 text-slate-600">${row.campaign}</td>
          <td class="p-3 text-xs text-slate-500 max-w-xs truncate" title="${row.full_link}">${row.full_link}</td>
          <td class="p-3">
            <button onclick="copyToClipboard('${row.full_link}')" class="text-xs bg-slate-100 hover:bg-blue-50 text-blue-600 px-2.5 py-1 rounded border border-slate-200 font-medium transition">复制</button>
          </td>
        </tr>
      `).join('');
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('链接已复制到剪贴板！');
      });
    }
  </script>
</body>
</html>

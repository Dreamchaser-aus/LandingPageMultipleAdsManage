<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引流效果管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- 头部 -->
    <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">多渠道引流数据后台</h1>
        <p class="text-slate-500 text-sm mt-1">支持多站点流量监测与 ROI 效果分析</p>
      </div>
      <div class="flex items-center gap-3">
        <input type="text" id="railwayUrl" placeholder="输入 Railway API 地址 (如 https://xxx.up.railway.app)" class="px-3 py-2 border rounded-lg text-sm w-80 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="saveAndFetch()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">刷新数据</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- 左侧：推广链接生成器 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-fit">
        <h2 class="text-lg font-bold mb-4 text-slate-900">🔗 推广链接生成器</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">落地页完整 URL</label>
            <input type="text" id="targetUrl" placeholder="https://my-landing-page.com" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">引流渠道 (utm_source)</label>
            <select id="channelSelect" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="tiktok">TikTok 抖音</option>
              <option value="xiaohongshu">小红书</option>
              <option value="google_ads">Google 广告</option>
              <option value="facebook">Facebook</option>
              <option value="wechat">微信公众号/群</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">广告计划名称 (utm_campaign)</label>
            <input type="text" id="campaignInput" placeholder="2026_promo" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button onclick="generateLink()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg text-sm font-medium transition">生成专属推广链接</button>

          <div id="linkResult" class="hidden mt-4 p-3 bg-slate-50 border rounded-lg break-all text-xs text-slate-600">
            <span class="font-bold text-slate-800 block mb-1">生成结果：</span>
            <span id="finalLink"></span>
          </div>
        </div>
      </div>

      <!-- 右侧：数据报表 -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <h2 class="text-lg font-bold mb-4 text-slate-900">📊 渠道转化效果明细</h2>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                <th class="p-3">目标域名</th>
                <th class="p-3">引流渠道</th>
                <th class="p-3">浏览量 (PV)</th>
                <th class="p-3">转化量 (Leads)</th>
                <th class="p-3">转化率 (CVR)</th>
              </tr>
            </thead>
            <tbody id="statsTable" class="divide-y divide-slate-100 text-sm">
              <tr>
                <td colspan="5" class="p-8 text-center text-slate-400">请输入 API 地址并点击“刷新数据”...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    window.onload = () => {
      // 默认自动填入当前 Railway 域名
      document.getElementById('railwayUrl').value = window.location.origin;
      saveAndFetch();
    };

    function saveAndFetch() {
      const url = document.getElementById('railwayUrl').value.trim().replace(/\/+$/, "");
      if (!url) return alert('请输入 Railway 提供的 API 域名');
      localStorage.setItem('railway_api_url', url);
      fetchData();
    }

    async function fetchData() {
      const baseUrl = localStorage.getItem('railway_api_url');
      if (!baseUrl) return;

      try {
        const res = await fetch(`${baseUrl}/api/stats`);
        const json = await res.json();
        if (json.success) {
          renderTable(json.data);
        }
      } catch (err) {
        alert('获取数据失败，请检查 Railway 域名是否正确或服务是否正常！');
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('statsTable');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">暂无引流数据</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(row => {
        const views = parseInt(row.views || 0);
        const leads = parseInt(row.leads || 0);
        const cvr = views > 0 ? ((leads / views) * 100).toFixed(2) + '%' : '0.00%';
        return `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-medium text-slate-900">${row.domain}</td>
            <td class="p-3"><span class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-xs font-semibold">${row.source}</span></td>
            <td class="p-3 text-slate-600">${views}</td>
            <td class="p-3 text-emerald-600 font-semibold">${leads}</td>
            <td class="p-3 text-slate-600">${cvr}</td>
          </tr>
        `;
      }).join('');
    }

    function generateLink() {
      const targetUrl = document.getElementById('targetUrl').value.trim();
      const channel = document.getElementById('channelSelect').value;
      const campaign = document.getElementById('campaignInput').value.trim() || 'default';

      if (!targetUrl) return alert('请输入落地页完整 URL');

      const urlObj = new URL(targetUrl);
      urlObj.searchParams.set('utm_source', channel);
      urlObj.searchParams.set('utm_campaign', campaign);

      document.getElementById('finalLink').innerText = urlObj.toString();
      document.getElementById('linkResult').classList.remove('hidden');
    }
  </script>
</body>
</html>

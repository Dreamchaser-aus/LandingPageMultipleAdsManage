<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引流效果管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- 头部 -->
    <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">多渠道引流数据后台</h1>
        <p class="text-slate-500 text-sm mt-1">支持多站点流量监测与 ROI 效果分析</p>
      </div>
      <div class="flex items-center gap-3">
        <input type="text" id="railwayUrl" readonly class="px-3 py-2 bg-slate-100 border rounded-lg text-sm w-72 text-slate-500">
        <button onclick="fetchAllData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">刷新所有数据</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- 左侧：推广链接生成器 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-fit">
        <h2 class="text-lg font-bold mb-4 text-slate-900">🔗 推广链接生成器</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">落地页 URL</label>
            <input type="text" id="targetUrl" placeholder="例如: https://xxx.up.railway.app" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">引流渠道 (utm_source)</label>
            <select id="channelSelect" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="tiktok">TikTok 抖音</option>
              <option value="xiaohongshu">小红书</option>
              <option value="google_ads">Google 广告</option>
              <option value="facebook">Facebook</option>
              <option value="wechat">微信公众号/群</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">活动名称 (utm_campaign)</label>
            <input type="text" id="campaignInput" placeholder="2026_summer" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button onclick="generateAndSaveLink()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg text-sm font-medium transition">生成并保存链接</button>
        </div>
      </div>

      <!-- 右侧：数据报表 & 历史链接 -->
      <div class="lg:col-span-2 space-y-8">
        
        <!-- 1. 数据报表 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
          <h2 class="text-lg font-bold mb-4 text-slate-900">📊 渠道转化效果明细</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                  <th class="p-3">目标域名</th>
                  <th class="p-3">引流渠道</th>
                  <th class="p-3">浏览量 (PV)</th>
                  <th class="p-3">转化量 (Leads)</th>
                  <th class="p-3">转化率</th>
                </tr>
              </thead>
              <tbody id="statsTable" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="5" class="p-8 text-center text-slate-400">数据加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 2. 已生成的推广链接历史 (新增) -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
          <h2 class="text-lg font-bold mb-4 text-slate-900">📋 已生成的推广链接历史</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                  <th class="p-3">渠道</th>
                  <th class="p-3">活动名</th>
                  <th class="p-3">完整链接</th>
                  <th class="p-3">操作</th>
                </tr>
              </thead>
              <tbody id="linksTable" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="4" class="p-8 text-center text-slate-400">暂无记录</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const baseUrl = window.location.origin;

    window.onload = () => {
      document.getElementById('railwayUrl').value = baseUrl;
      document.getElementById('targetUrl').value = baseUrl; // 默认填入当前域名
      fetchAllData();
    };

    function fetchAllData() {
      fetchStats();
      fetchLinksHistory();
    }

    // 1. 加载统计报表
    async function fetchStats() {
      try {
        const res = await fetch(`${baseUrl}/api/stats`);
        const json = await res.json();
        if (json.success) renderStatsTable(json.data);
      } catch (err) {
        console.error(err);
      }
    }

    function renderStatsTable(data) {
      const tbody = document.getElementById('statsTable');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">暂无引流数据</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(row => {
        const views = parseInt(row.views || 0);
        const leads = parseInt(row.leads || 0);
        const cvr = views > 0 ? ((leads / views) * 100).toFixed(2) + '%' : '0.00%';
        return `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-medium text-slate-900">${row.domain}</td>
            <td class="p-3"><span class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-xs font-semibold">${row.source}</span></td>
            <td class="p-3 text-slate-600">${views}</td>
            <td class="p-3 text-emerald-600 font-semibold">${leads}</td>
            <td class="p-3 text-slate-600">${cvr}</td>
          </tr>
        `;
      }).join('');
    }

    // 2. 加载链接历史记录
    async function fetchLinksHistory() {
      try {
        const res = await fetch(`${baseUrl}/api/links`);
        const json = await res.json();
        if (json.success) renderLinksTable(json.data);
      } catch (err) {
        console.error(err);
      }
    }

    function renderLinksTable(data) {
      const tbody = document.getElementById('linksTable');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-slate-400">尚未生成过链接</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(row => {
        return `
          <tr class="hover:bg-slate-50">
            <td class="p-3"><span class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs font-semibold">${row.source}</span></td>
            <td class="p-3 text-slate-600">${row.campaign}</td>
            <td class="p-3 text-xs text-slate-500 max-w-xs truncate" title="${row.full_link}">${row.full_link}</td>
            <td class="p-3">
              <button onclick="copyToClipboard('${row.full_link}')" class="text-xs bg-slate-100 hover:bg-blue-50 text-blue-600 px-2.5 py-1 rounded border border-slate-200 font-medium transition">复制</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 3. 生成并保存新链接
    async function generateAndSaveLink() {
      const targetUrl = document.getElementById('targetUrl').value.trim();
      const channel = document.getElementById('channelSelect').value;
      const campaign = document.getElementById('campaignInput').value.trim() || 'default';

      if (!targetUrl) return alert('请输入落地页 URL');

      try {
        const urlObj = new URL(targetUrl);
        urlObj.searchParams.set('utm_source', channel);
        urlObj.searchParams.set('utm_campaign', campaign);
        const fullLink = urlObj.toString();

        // 请求后端保存至数据库
        const res = await fetch(`${baseUrl}/api/links`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            target_url: targetUrl,
            source: channel,
            campaign: campaign,
            full_link: fullLink
          })
        });

        const json = await res.json();
        if (json.success) {
          fetchLinksHistory(); // 重新刷出历史记录
          alert('链接生成并保存成功！');
        }
      } catch (err) {
        alert('生成链接失败，请检查 URL 格式是否正确（例如必须包含 https://）');
      }
    }

    // 复制辅助函数
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('链接已成功复制到剪贴板！');
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精选服务导航</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between items-center p-4 antialiased">

  <div class="max-w-md w-full my-auto space-y-6">
    <!-- 头部 Profile 区域 -->
    <div class="text-center space-y-3">
      <div class="w-20 h-20 bg-blue-600 rounded-full mx-auto flex items-center justify-center text-3xl shadow-lg shadow-blue-500/20 text-white font-bold">
        🚀
      </div>
      <h1 class="text-2xl font-bold text-slate-800">热门优质项目推荐</h1>
      <p class="text-slate-500 text-sm">点击下方卡片即可直接进入对应站点</p>
    </div>

    <!-- 站点卡片列表 -->
    <div id="siteList" class="space-y-3">
      <div class="text-center text-slate-400 py-8">正在加载站点资源...</div>
    </div>
  </div>

  <footer class="text-xs text-slate-400 py-4 text-center">
    © 2026 Traffic Navigator. All rights reserved.
  </footer>

  <script>
    const baseUrl = window.location.origin;

    // 1. 获取或生成专属的 Visitor ID
    function getVisitorId() {
      let vid = localStorage.getItem('user_visitor_id');
      if (!vid) {
        vid = 'vid_' + Math.random().toString(36).substr(2, 8) + '_' + Date.now().toString().slice(-6);
        localStorage.setItem('user_visitor_id', vid);
      }
      return vid;
    }

    // 2. 页面加载完毕获取动态站点
    window.onload = () => {
      fetchWebsites();
    };

    async function fetchWebsites() {
      try {
        const res = await fetch(`${baseUrl}/api/websites`);
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          renderSites(json.data);
        } else {
          document.getElementById('siteList').innerHTML = '<div class="text-center text-slate-400 py-4">暂无配置站点</div>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderSites(sites) {
      const container = document.getElementById('siteList');
      container.innerHTML = sites.map(site => `
        <div onclick="trackAndRedirect(${site.id}, '${site.name}', '${site.url}')" 
             class="group bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hover:shadow-md hover:border-blue-400 transition-all cursor-pointer flex items-center justify-between">
          <div class="flex items-center space-x-3.5">
            <img src="${site.icon_url || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + site.id}" 
                 class="w-12 h-12 rounded-xl object-cover bg-slate-50">
            <div>
              <h3 class="font-bold text-slate-800 text-base group-hover:text-blue-600 transition-colors">${site.name}</h3>
              <p class="text-slate-500 text-xs mt-0.5 line-clamp-1">${site.desc_text || '点击进入官方网站'}</p>
            </div>
          </div>
          <div class="w-8 h-8 rounded-full bg-slate-50 group-hover:bg-blue-50 flex items-center justify-center text-slate-400 group-hover:text-blue-600 transition-all">
            ➔
          </div>
        </div>
      `).join('');
    }

    // 3. 点击卡片：追踪轨迹 + 页面跳转
    function trackAndRedirect(siteId, siteName, targetUrl) {
      const visitorId = getVisitorId();
      
      const urlParams = new URLSearchParams(window.location.search);
      const source = urlParams.get('utm_source') || 'direct';
      const campaign = urlParams.get('utm_campaign') || 'none';

      const payload = JSON.stringify({
        visitor_id: visitorId,
        website_id: siteId,
        website_name: siteName,
        source: source,
        campaign: campaign
      });

      // 异步无阻塞上报日志
      if (navigator.sendBeacon) {
        navigator.sendBeacon(`${baseUrl}/api/track-click`, new Blob([payload], { type: 'application/json' }));
      } else {
        fetch(`${baseUrl}/api/track-click`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true
        });
      }

      // 跳转目标地址
      window.open(targetUrl, '_blank');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malaysia 4D 官方直达与精选聚合导航</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .glow-bg {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      animation: fadeInUp 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col items-center justify-between font-sans relative overflow-x-hidden selection:bg-amber-500 selection:text-black">

  <!-- 背景装饰光晕 -->
  <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-gradient-to-r from-blue-600/20 to-amber-500/20 blur-[120px] rounded-full pointer-events-none glow-bg"></div>

  <!-- 主容器 -->
  <div class="w-full max-w-lg mx-auto p-4 sm:p-6 flex flex-col z-10 my-auto">
    
    <!-- 头部区域 -->
    <div class="text-center mb-8 pt-4">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-amber-500 via-red-600 to-blue-600 rounded-3xl shadow-2xl shadow-amber-500/20 mb-4 p-0.5 transform hover:scale-105 transition-transform duration-300">
        <div class="w-full h-full bg-[#0f172a] rounded-[22px] flex items-center justify-center text-3xl">
          🎲
        </div>
      </div>
      <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-amber-400 bg-clip-text text-transparent">
        MALAYSIA 4D HUB
      </h1>
      <p class="text-xs text-slate-400 mt-2 font-medium tracking-wide">
        ✨ 汇聚全马官方开彩通道 · 安全直达 · 实时追踪
      </p>
    </div>

    <!-- 站点/通道列表容器 -->
    <div id="siteList" class="space-y-3.5">
      <!-- 动态加载提示 -->
      <div class="text-center text-slate-400 py-12 text-sm flex flex-col items-center justify-center space-y-3 bg-slate-900/40 rounded-2xl border border-slate-800 backdrop-blur-md">
        <svg class="animate-spin h-6 w-6 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-slate-400 font-medium">正在连接官方服务器数据...</span>
      </div>
    </div>

    <!-- 底部公告或提示 -->
    <div class="mt-8 text-center bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 backdrop-blur-md">
      <div class="flex items-center justify-center space-x-1.5 text-xs text-amber-400 font-semibold mb-1">
        <span>🔒</span>
        <span>安全保障提示</span>
      </div>
      <p class="text-[11px] text-slate-400 leading-relaxed">
        所有链接均为官方直达通道，请核对防伪域名。理性娱乐，享受精彩瞬间。
      </p>
    </div>

  </div>

  <!-- 页脚信息 -->
  <footer class="w-full text-center py-6 text-[11px] text-slate-500 border-t border-slate-900 z-10">
    © 2026 Malaysia 4D Portal System. All Rights Reserved.
  </footer>

  <script>
    const baseUrl = window.location.origin;

    // 1. 获取或生成唯一的 Visitor ID
    function getVisitorId() {
      let vid = localStorage.getItem('user_visitor_id');
      if (!vid) {
        vid = 'vid_' + Math.random().toString(36).substr(2, 8) + '_' + Date.now().toString().slice(-6);
        localStorage.setItem('user_visitor_id', vid);
      }
      return vid;
    }

    // 2. 抓取与锁定 UTM 渠道参数（带 Session 缓存防丢失）
    function captureAndGetUtm() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlSource = urlParams.get('source') || urlParams.get('utm_source');
      const urlCampaign = urlParams.get('campaign') || urlParams.get('utm_campaign');

      if (urlSource) sessionStorage.setItem('current_utm_source', urlSource);
      if (urlCampaign) sessionStorage.setItem('current_utm_campaign', urlCampaign);

      const source = urlSource || sessionStorage.getItem('current_utm_source') || 'direct';
      const campaign = urlCampaign || sessionStorage.getItem('current_utm_campaign') || 'none';

      return { source, campaign };
    }

    // 3. 页面初始化
    window.onload = () => {
      captureAndGetUtm();
      fetchWebsites();
    };

    // 获取后台配置的站点卡片（对接你的 /api/websites 接口）
    async function fetchWebsites() {
      try {
        const res = await fetch(`${baseUrl}/api/websites`);
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          renderSites(json.data);
        } else {
          document.getElementById('siteList').innerHTML = `
            <div class="text-center text-slate-400 py-10 text-sm bg-slate-900/40 rounded-2xl border border-dashed border-slate-800">
              暂无配置数据，请前往后台添加频道
            </div>`;
        }
      } catch (err) {
        document.getElementById('siteList').innerHTML = `
          <div class="text-center text-red-400 py-10 text-sm bg-red-950/20 rounded-2xl border border-red-900/50">
            数据同步失败，请检查网络后重试
          </div>`;
      }
    }

    // 渲染带有 4D 聚合网风格的卡片
    function renderSites(sites) {
      const container = document.getElementById('siteList');
      container.innerHTML = sites.map((site, index) => `
        <div data-id="${site.id}" 
             data-name="${encodeURIComponent(site.name)}" 
             data-url="${encodeURIComponent(site.url)}" 
             style="animation-delay: ${index * 0.05}s"
             class="site-card fade-in-up group bg-slate-900/80 hover:bg-slate-800/90 p-4 sm:p-4.5 rounded-2xl border border-slate-800 hover:border-amber-500/50 transition-all duration-300 cursor-pointer flex items-center justify-between shadow-lg shadow-black/20 hover:shadow-amber-500/5 relative overflow-hidden">
          
          <!-- 左侧微光特效 -->
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-amber-500 to-red-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>

          <div class="flex items-center space-x-3.5 min-w-0 pr-2">
            <img src="${site.icon_url || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + site.id}" 
                 class="w-12 h-12 rounded-xl object-cover bg-slate-800 p-1 shadow-inner shrink-0 border border-slate-700/50 group-hover:scale-105 transition-transform">
            <div class="min-w-0">
              <div class="flex items-center space-x-2">
                <h3 class="font-bold text-slate-100 text-sm group-hover:text-amber-400 transition-colors truncate">${site.name}</h3>
                <span class="px-1.5 py-0.5 text-[9px] bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded font-medium shrink-0">OFFICIAL</span>
              </div>
              <p class="text-slate-400 text-xs mt-1 truncate font-normal">${site.desc_text || '点击进入官方专属开彩与查询通道'}</p>
            </div>
          </div>

          <!-- 右侧箭头按钮 -->
          <div class="w-9 h-9 rounded-xl bg-slate-800/80 group-hover:bg-gradient-to-r group-hover:from-amber-500 group-hover:to-red-600 flex items-center justify-center text-slate-400 group-hover:text-white transition-all shadow-sm shrink-0 border border-slate-700/60 group-hover:border-transparent">
            <svg class="w-4 h-4 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
            </svg>
          </div>
        </div>
      `).join('');

      // 绑定点击事件：完成无感打点并跳转
      document.querySelectorAll('.site-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.getAttribute('data-id');
          const name = decodeURIComponent(card.getAttribute('data-name'));
          const url = decodeURIComponent(card.getAttribute('data-url'));
          trackAndRedirect(id, name, url);
        });
      });
    }

    // 4. 异步打点并无感跳转
    function trackAndRedirect(siteId, siteName, targetUrl) {
      const visitorId = getVisitorId();
      const { source, campaign } = captureAndGetUtm();

      const payload = {
        visitor_id: visitorId,
        target_domain: targetUrl,
        source: source,
        campaign: campaign
      };

      // 使用 keepalive 保证跳转瞬间请求不被浏览器中断
      fetch(`${baseUrl}/api/track`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(err => console.error('Track error:', err));

      window.open(targetUrl, '_blank');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA88 PARTNERSHIP - Expert Reviews & Smart Play Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans antialiased">

  <!-- 顶部导航栏 -->
  <header class="border-b border-slate-800 bg-[#111827]/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="font-bold text-lg tracking-wider text-amber-400">MEGA88 PARTNERSHIP</span>
      </div>
      <nav class="hidden md:flex items-center space-x-6 text-sm text-slate-300 font-medium">
        <a href="#Home" class="hover:text-amber-400 transition-colors">Home</a>
        <a href="#Slideshow" class="hover:text-amber-400 transition-colors">Highlights</a>
        <a href="#Casino" class="hover:text-amber-400 transition-colors">Online Casinos</a>
        <a href="#AboutUs" class="hover:text-amber-400 transition-colors">About Us</a>
      </nav>
      <span class="text-xs text-slate-400 bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700/60">Verified & Secure</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-12">

    <!-- 1. Slideshow 动态轮播图 -->
    <section id="Slideshow" class="pt-4">
      <div class="swiper mySwiper rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
        <div class="swiper-wrapper" id="dynamicSlidesWrapper">
          <!-- 动态加载 -->
        </div>
        <div class="swiper-pagination"></div>
      </div>
    </section>

    <!-- 2. Multiple Companies 多个公司/平台区 -->
    <section id="Casino" class="space-y-6 pt-4">
      <div class="flex flex-col md:flex-row md:items-end justify-between border-b border-slate-800/80 pb-4">
        <div>
          <span class="text-amber-400 text-xs font-bold uppercase tracking-wider">Trusted Navigation</span>
          <h2 class="text-xl sm:text-2xl font-bold text-white mt-1">Featured Online Casino Partners</h2>
        </div>
        <p class="text-xs text-slate-400 mt-2 md:mt-0">Click any partner below to explore securely with active tracking.</p>
      </div>

      <div id="gang-portal-hub">
        <div id="siteList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 动态加载所有卡片 -->
        </div>
      </div>
    </section>

    <!-- 3. About Us 关于我们区 -->
    <section id="AboutUs" class="bg-[#111827] rounded-3xl p-6 sm:p-10 border border-slate-800 shadow-xl space-y-6">
      <div class="max-w-2xl" id="aboutContentArea">
        <!-- 动态加载 -->
      </div>
    </section>

  </main>

  <footer class="border-t border-slate-800 bg-[#111827] mt-16 py-8 text-center text-xs text-slate-500">
    <p>&copy; 2026 4D Gang Malaysia. All Rights Reserved. Play Responsibly.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // 基础防崩溃默认数据
    const defaultData = {
      companies: [
        { id: 1, name: "MegaWin Casino Malaysia", url: "https://google.com", desc_text: "Top-tier verified gaming platform offering safe entertainment and instant bonuses.", icon_url: "" },
        { id: 2, name: "Lucky4D Partner Hub", url: "https://google.com", desc_text: "Trusted insights and smart play guides curated for professional enthusiasts.", icon_url: "" },
        { id: 3, name: "Grand Spin Official", url: "https://google.com", desc_text: "Premier destination for modern digital slot reviews and high RTP games.", icon_url: "" },
        { id: 4, name: "Royal Bet Portal", url: "https://google.com", desc_text: "Fast withdrawals and verified security compliance for regional players.", icon_url: "" }
      ],
      slides: [
        { badge: "Hot Bonuses 2026", title: "Expert Reviews & Smart Play Guidance", desc: "Discover trusted platform insights, verified ratings, and responsible play strategies curated by industry professionals.", btnText: "Explore Casinos" },
        { badge: "100% Verified Partners", title: "Tested Games & Transparent Ratings", desc: "Over 1,380+ games tested and 680+ casino sites reviewed monthly to ensure a safer navigation experience.", btnText: "Learn More About Us" }
      ],
      about: {
        badge: "About 4D Gang Malaysia",
        title: "Dedicated to Safer & Smarter Play",
        desc: "4D Gang Malaysia is built by a team of veteran researchers and analysts. Our mission is to cut through the noise of online platforms, delivering transparent, unbiased information and robust guidance.",
        stats: [
          { val: "680+", label: "Casino Sites Reviewed" },
          { val: "1,380+", label: "Games Tested" },
          { val: "376+ Hrs", label: "Monthly Research" }
        ]
      }
    };

    function loadSiteContent() {
      const dataStr = localStorage.getItem('gang_site_content');
      return dataStr ? JSON.parse(dataStr) : defaultData;
    }

    // 渲染前端动态内容
    async function renderFrontend() {
      let data = loadSiteContent();

      // 从后端 API 请求最新的全量卡片数据
      try {
        const res = await fetch('/api/websites');
        const json = await res.json();
        if (json.success && Array.isArray(json.data) && json.data.length > 0) {
          data.companies = json.data;
          
          // 强行刷新本地缓存，防止旧的 2 卡片缓存滞后
          const currentData = loadSiteContent();
          currentData.companies = json.data;
          localStorage.setItem('gang_site_content', JSON.stringify(currentData));
        }
      } catch (e) {
        console.warn('从 API 获取最新卡片失败，使用备用/本地数据:', e);
      }

      // 1. 渲染轮播图
      const slideWrapper = document.getElementById('dynamicSlidesWrapper');
      if (slideWrapper && data.slides) {
        slideWrapper.innerHTML = data.slides.map(s => `
          <div class="swiper-slide bg-gradient-to-r from-slate-900 via-amber-950/40 to-slate-900 p-8 sm:p-12 md:p-16 flex flex-col justify-center min-h-[280px] sm:min-h-[340px] relative">
            <span class="px-3 py-1 text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full w-max mb-3 font-semibold">${s.badge}</span>
            <h2 class="text-2xl sm:text-4xl font-black text-white mb-3 max-w-xl">${s.title}</h2>
            <p class="text-slate-300 text-xs sm:text-sm max-w-lg mb-6 leading-relaxed">${s.desc}</p>
            <div>
              <a href="#Casino" class="inline-flex items-center space-x-2 px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-red-600 text-white font-semibold text-xs sm:text-sm shadow-lg">
                <span>${s.btnText}</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
              </a>
            </div>
          </div>
        `).join('');

        if (window.mySwiperInstance) {
          window.mySwiperInstance.destroy(true, true);
        }
        window.mySwiperInstance = new Swiper(".mySwiper", {
          loop: true,
          autoplay: { delay: 4500, disableOnInteraction: false },
          pagination: { el: ".swiper-pagination", clickable: true },
        });
      }

      // 2. 渲染所有卡片列表（包含字段空缺清洗容错，确保全部无阻展示）
      const siteList = document.getElementById('siteList');
      if (siteList && Array.isArray(data.companies)) {
        siteList.innerHTML = data.companies.map((site, index) => {
          // 容错清洗：防止后端存在 null 导致循环报错中断
          const siteId = site.id || index;
          const safeName = site.name || 'Verified Partner';
          const safeUrl = site.url || '#';
          const safeDesc = site.desc_text || site.description || 'Official safe navigation channel & trusted review.';
          const safeIcon = site.icon_url || site.logo || `https://api.dicebear.com/7.x/identicon/svg?seed=${siteId}`;

          return `
            <div data-id="${siteId}" 
                 data-name="${encodeURIComponent(safeName)}" 
                 data-url="${encodeURIComponent(safeUrl)}" 
                 style="animation-delay: ${index * 0.04}s"
                 class="fade-in group bg-[#111827] hover:bg-[#1f2937] p-4.5 sm:p-5 rounded-2xl border border-slate-800 hover:border-amber-500/55 transition-all duration-300 cursor-pointer flex flex-col justify-between shadow-xl relative overflow-hidden">
              
              <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-amber-500 to-red-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>

              <div class="flex items-start space-x-3.5 mb-4">
                <img src="${safeIcon}" 
                     alt="${safeName}"
                     class="w-12 h-12 rounded-xl object-cover bg-slate-800 p-1 shrink-0 border border-slate-700/60 group-hover:scale-105 transition-transform"
                     onerror="this.src='https://api.dicebear.com/7.x/identicon/svg?seed=${siteId}'">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-slate-100 text-sm group-hover:text-amber-400 transition-colors truncate">${safeName}</h3>
                    <span class="px-2 py-0.5 text-[9px] bg-amber-500/15 text-amber-400 border border-amber-500/20 rounded font-semibold shrink-0">Verified</span>
                  </div>
                  <p class="text-slate-400 text-xs mt-1.5 line-clamp-2 leading-relaxed">${safeDesc}</p>
                </div>
              </div>

              <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs font-medium">
                <span class="text-slate-400 text-[11px] flex items-center space-x-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span>Tracking Active</span>
                </span>
                <div class="px-3 py-1.5 rounded-xl bg-slate-800 group-hover:bg-gradient-to-r group-hover:from-amber-500 group-hover:to-red-600 text-slate-300 group-hover:text-white transition-all shadow-sm flex items-center space-x-1">
                  <span>Visit Site</span>
                  <svg class="w-3.5 h-3.5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                  </svg>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // 为每个卡片绑定点击与追踪事件
        document.querySelectorAll('#siteList > div').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.getAttribute('data-id');
            const name = decodeURIComponent(card.getAttribute('data-name'));
            const url = decodeURIComponent(card.getAttribute('data-url'));
            trackAndRedirect(id, name, url);
          });
        });
      }

      // 3. 渲染 About Us
      const aboutArea = document.getElementById('aboutContentArea');
      if (aboutArea && data.about) {
        aboutArea.innerHTML = `
          <span class="px-3 py-1 text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full font-semibold">${data.about.badge}</span>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-3 mb-2">${data.about.title}</h2>
          <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">${data.about.desc}</p>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-6 border-t border-slate-800 mt-6">
            ${data.about.stats.map(st => `
              <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                <div class="text-amber-400 font-bold text-lg mb-1">${st.val}</div>
                <div class="text-slate-300 font-semibold text-xs mb-1">${st.label}</div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    // 访客 ID 管理
    function getVisitorId() {
      let vid = localStorage.getItem('gang_visitor_id');
      if (!vid) {
        vid = 'vid_' + Math.random().toString(36).substr(2, 8) + '_' + Date.now().toString().slice(-6);
        localStorage.setItem('gang_visitor_id', vid);
      }
      return vid;
    }

    // UTM 参数解析
    function captureAndGetUtm() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlSource = urlParams.get('source') || urlParams.get('utm_source');
      const urlCampaign = urlParams.get('campaign') || urlParams.get('utm_campaign');

      if (urlSource) sessionStorage.setItem('gang_utm_source', urlSource);
      if (urlCampaign) sessionStorage.setItem('gang_utm_campaign', urlCampaign);

      const source = urlSource || sessionStorage.getItem('gang_utm_source') || 'direct';
      const campaign = urlCampaign || sessionStorage.getItem('gang_utm_campaign') || 'none';

      return { source, campaign };
    }

    // 打点追踪与跳转
    function trackAndRedirect(siteId, siteName, targetUrl) {
      const visitorId = getVisitorId();
      const { source, campaign } = captureAndGetUtm();

      const payload = {
        visitor_id: visitorId,
        target_domain: siteName || targetUrl,
        source: source,
        campaign: campaign
      };

      const endpoint = '/api/track';
      let isSent = false;

      if (navigator.sendBeacon) {
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        isSent = navigator.sendBeacon(endpoint, blob);
      }

      if (!isSent) {
        fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        }).catch(err => console.error('Tracking failed:', err));
      }

      setTimeout(() => {
        if (targetUrl && targetUrl !== '#') {
          window.location.href = targetUrl;
        } else {
          alert('该平台暂未配置有效的跳转链接。');
        }
      }, 150);
    }

    document.addEventListener('DOMContentLoaded', () => {
      captureAndGetUtm();
      renderFrontend();
    });
  </script>
</body>
</html>

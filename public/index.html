<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEGA88 PARTNERSHIP - Expert Reviews & Smart Play Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in { animation: fadeIn 0.35s ease-out forwards; }
      .swiper-pagination-bullet { background: rgba(255,255,255,0.4) !important; }
      .swiper-pagination-bullet-active { background: #f59e0b !important; width: 16px !important; border-radius: 9999px !important; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-900">

  <!-- 顶部导航栏 -->
  <header class="border-b border-slate-800 bg-[#111827]/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
  <!-- 将下方的 src 替换为您实际的 logo 链接或本地路径，例如 src="./images/logo.png" -->
  <img src="https://res.cloudinary.com/dqctvbenv/image/upload/v1785737397/telegram_bot/wiixl2lxuxnvwwpogxeh.png" alt="MEGA88 Logo" class="h-8 sm:h-10 w-auto object-contain">
  <span class="font-bold text-base sm:text-lg tracking-wider text-amber-400">MEGA88 PARTNERSHIP</span>
</div>

      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
        <a href="#Casino" class="nav-link text-amber-400 hover:text-amber-400 transition-colors">Home</a>
        <a href="#Slideshow" class="nav-link text-slate-300 hover:text-amber-400 transition-colors">Highlights</a>
        <a href="#AboutUs" class="nav-link text-slate-300 hover:text-amber-400 transition-colors">About Us</a>
      </nav>

      <div class="flex items-center space-x-3">
        <span class="hidden sm:inline-block text-[11px] text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700/60">Verified & Secure</span>
        <button id="mobileMenuBtn" aria-label="Toggle Menu" class="md:hidden p-2 text-slate-300 hover:text-amber-400 active:scale-95 transition-transform focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- 移动端下拉菜单 -->
    <div id="mobileMenu" class="hidden md:hidden border-t border-slate-800/80 bg-[#111827] px-4 py-3 space-y-2.5 text-sm font-medium shadow-2xl">
      <a href="#Casino" class="mobile-nav-link block py-2 text-amber-400 border-b border-slate-800/50">Home</a>
      <a href="#Slideshow" class="mobile-nav-link block py-2 text-slate-300 border-b border-slate-800/50">Highlights</a>
      <a href="#AboutUs" class="mobile-nav-link block py-2 text-slate-300">About Us</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3.5 sm:px-6 py-6 sm:py-8 min-h-[70vh]">
    <!-- 1. 站点显示区 (Casino) -->
    <section id="Casino" class="view-section space-y-4 sm:space-y-6 pt-2 block">
      <div class="mb-4 sm:mb-6">
        <h2 class="text-xl sm:text-2xl font-bold text-white">Featured Online Casinos</h2>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Select a verified partner below to start playing safely.</p>
      </div>
      <div id="gang-portal-hub">
        <div id="siteList" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5"></div>
      </div>
    </section>

    <!-- 2. Slideshow 动态轮播图 -->
    <section id="Slideshow" class="view-section pt-2 hidden">
      <div class="swiper mySwiper rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
        <div class="swiper-wrapper" id="dynamicSlidesWrapper"></div>
        <div class="swiper-pagination !bottom-2 sm:!bottom-4"></div>
      </div>
    </section>

    <!-- 3. About Us 关于我们区 -->
    <section id="AboutUs" class="view-section bg-[#111827] rounded-2xl sm:rounded-3xl p-5 sm:p-10 border border-slate-800 shadow-xl space-y-6 hidden">
      <div class="max-w-2xl" id="aboutContentArea"></div>
    </section>
  </main>

  <footer class="border-t border-slate-800 bg-[#111827] mt-12 py-6 text-center text-[11px] sm:text-xs text-slate-500">
    <p>&copy; 2026 MEGA88 PARTNERSHIP. All Rights Reserved. Play Responsibly.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    function switchSection(targetId) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.add('hidden'));
      const targetEl = document.getElementById(targetId);
      if (targetEl) targetEl.classList.remove('hidden');

      if (targetId === 'Slideshow' && window.mySwiperInstance) {
        window.mySwiperInstance.update();
      }

      document.querySelectorAll('.nav-link, .mobile-nav-link').forEach(link => {
        link.classList.remove('text-amber-400');
        link.classList.add('text-slate-300');
        if (link.getAttribute('href') === `#${targetId}`) {
          link.classList.remove('text-slate-300');
          link.classList.add('text-amber-400');
        }
      });
    }

    document.querySelectorAll('.nav-link, .mobile-nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = link.getAttribute('href').replace('#', '');
        switchSection(targetId);
        const mobileMenu = document.getElementById('mobileMenu');
        if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
          mobileMenu.classList.add('hidden');
        }
      });
    });

    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.toggle('hidden');
      });
    }

    const defaultData = {
      companies: [
        { id: 1, name: "MegaWin Casino Malaysia", url: "https://google.com", desc_text: "Top-tier verified gaming platform offering safe entertainment and instant bonuses.", icon_url: "" },
        { id: 2, name: "Lucky4D Partner Hub", url: "https://google.com", desc_text: "Trusted insights and smart play guides curated for professional enthusiasts.", icon_url: "" }
      ],
      slides: [
        { badge: "Hot Bonuses 2026", title: "Expert Reviews & Smart Play Guidance", desc: "Discover trusted platform insights, verified ratings, and responsible play strategies curated by industry professionals.", btnText: "Explore Casinos" },
        { badge: "100% Verified Partners", title: "Tested Games & Transparent Ratings", desc: "Over 1,380+ games tested and 680+ casino sites reviewed monthly to ensure a safer navigation experience.", btnText: "Learn More About Us" }
      ],
      about: {
        badge: "About MEGA88 PARTNERSHIP",
        title: "Dedicated to Safer & Smarter Play",
        desc: "MEGA88 PARTNERSHIP is built by a team of veteran researchers and analysts. Our mission is to cut through the noise of online platforms, delivering transparent, unbiased information and robust guidance.",
        stats: [
          { val: "680+", label: "Casino Sites Reviewed" },
          { val: "1,380+", label: "Games Tested" },
          { val: "376+ Hrs", label: "Monthly Research" }
        ]
      }
    };

    function loadSiteContent() {
      try {
        const dataStr = localStorage.getItem('gang_site_content');
        return dataStr ? JSON.parse(dataStr) : defaultData;
      } catch (e) {
        return defaultData;
      }
    }

    async function renderFrontend() {
      let data = loadSiteContent();

      try {
        const res = await fetch('/api/websites');
        const json = await res.json();
        if (json.success && Array.isArray(json.data) && json.data.length > 0) {
          data.companies = json.data;
        }
      } catch (e) {
        console.warn('API request failed, using local storage fallback:', e);
      }

      const slideWrapper = document.getElementById('dynamicSlidesWrapper');
      if (slideWrapper && data.slides) {
        slideWrapper.innerHTML = data.slides.map(s => `
          <div class="swiper-slide bg-gradient-to-r from-slate-900 via-amber-950/40 to-slate-900 p-6 sm:p-12 md:p-16 flex flex-col justify-center pb-12 sm:pb-12 min-h-[260px] sm:min-h-[340px] relative">
            <span class="px-2.5 py-0.5 text-[10px] sm:text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full w-max mb-2 sm:mb-3 font-semibold">${s.badge}</span>
            <h2 class="text-xl sm:text-4xl font-black text-white mb-2 sm:mb-3 max-w-xl leading-snug">${s.title}</h2>
            <p class="text-slate-300 text-xs sm:text-sm max-w-lg mb-4 sm:mb-6 leading-relaxed line-clamp-3 sm:line-clamp-none">${s.desc}</p>
            <div>
              <button onclick="switchSection('Casino')" class="inline-flex items-center space-x-2 px-5 py-2 sm:px-6 sm:py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-red-600 text-white font-semibold text-xs sm:text-sm shadow-lg active:scale-95 transition-transform">
                <span>${s.btnText}</span>
                <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
              </button>
            </div>
          </div>
        `).join('');

        if (window.mySwiperInstance) window.mySwiperInstance.destroy(true, true);
        window.mySwiperInstance = new Swiper(".mySwiper", {
          loop: true,
          autoplay: { delay: 4500, disableOnInteraction: false },
          pagination: { el: ".swiper-pagination", clickable: true },
        });
      }

      const siteList = document.getElementById('siteList');
      if (siteList && Array.isArray(data.companies)) {
        siteList.innerHTML = data.companies.map((site, index) => {
          const siteId = site.id || index;
          const safeName = site.name || 'Verified Partner';
          const safeUrl = site.url || '#';
          const safeDesc = site.desc_text || site.description || 'Official safe navigation channel & trusted review.';
          const safeIcon = site.icon_url || site.logo || `https://api.dicebear.com/7.x/identicon/svg?seed=${siteId}`;

          return `
            <div data-id="${siteId}" data-name="${encodeURIComponent(safeName)}" data-url="${encodeURIComponent(safeUrl)}" 
                 style="animation-delay: ${index * 0.03}s"
                 class="fade-in group bg-[#161f30] hover:bg-[#1a2538] p-4 sm:p-5 rounded-2xl border border-slate-700/50 hover:border-amber-500/50 transition-all duration-300 active:scale-[0.98] cursor-pointer flex flex-col shadow-lg h-full">
              <div class="flex items-start space-x-4 mb-4">
                <div class="w-12 h-12 sm:w-14 sm:h-14 bg-slate-800 rounded-xl p-1.5 flex items-center justify-center shrink-0 overflow-hidden group-hover:scale-105 transition-transform border border-slate-700/60">
                  <img src="${safeIcon}" alt="${safeName}" class="w-full h-full object-contain rounded-lg" onerror="this.src='https://api.dicebear.com/7.x/identicon/svg?seed=${siteId}'">
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 mb-1">
                    <h3 class="font-bold text-slate-100 text-sm sm:text-base truncate group-hover:text-amber-400 transition-colors">${safeName}</h3>
                    <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                    </svg>
                  </div>
                  <p class="text-slate-400 text-xs sm:text-sm line-clamp-2 leading-relaxed">${safeDesc}</p>
                </div>
              </div>
              <div class="mt-auto pt-4 border-t border-slate-700/40">
                <div class="w-full py-2.5 rounded-xl bg-amber-500/10 text-amber-400 group-hover:bg-amber-500 group-hover:text-slate-900 font-bold text-[13px] sm:text-sm transition-colors flex items-center justify-center space-x-2">
                  <span>Visit Website</span>
                  <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                  </svg>
                </div>
              </div>
            </div>
          `;
        }).join('');

        document.querySelectorAll('#siteList > div').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.getAttribute('data-id');
            const name = decodeURIComponent(card.getAttribute('data-name'));
            const url = decodeURIComponent(card.getAttribute('data-url'));
            trackAndRedirect(id, name, url);
          });
        });
      }

      const aboutArea = document.getElementById('aboutContentArea');
      if (aboutArea && data.about) {
        aboutArea.innerHTML = `
          <span class="px-2.5 py-0.5 text-[10px] sm:text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full font-semibold">${data.about.badge}</span>
          <h2 class="text-xl sm:text-3xl font-extrabold text-white mt-2 mb-2">${data.about.title}</h2>
          <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">${data.about.desc}</p>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-4 pt-5 border-t border-slate-800/80 mt-5">
            ${data.about.stats.map(st => `
              <div class="p-3.5 sm:p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 flex sm:flex-col justify-between sm:justify-start items-center sm:items-start">
                <div class="text-slate-300 font-medium text-xs sm:mb-1 order-1 sm:order-2">${st.label}</div>
                <div class="text-amber-400 font-bold text-base sm:text-lg order-2 sm:order-1">${st.val}</div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function getVisitorId() {
      let vid = localStorage.getItem('gang_visitor_id');
      if (!vid) {
        vid = 'vid_' + Math.random().toString(36).substr(2, 8) + '_' + Date.now().toString().slice(-6);
        localStorage.setItem('gang_visitor_id', vid);
      }
      return vid;
    }

    function captureAndGetUtm() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlSource = urlParams.get('source') || urlParams.get('utm_source');
      const urlCampaign = urlParams.get('campaign') || urlParams.get('utm_campaign');

      if (urlSource) sessionStorage.setItem('gang_utm_source', urlSource);
      if (urlCampaign) sessionStorage.setItem('gang_utm_campaign', urlCampaign);

      const source = urlSource || sessionStorage.getItem('gang_utm_source') || 'direct';
      const campaign = urlCampaign || sessionStorage.getItem('gang_utm_campaign') || 'none';
      return { source, campaign };
    }

    function trackAndRedirect(siteId, siteName, targetUrl) {
      const payload = {
        visitor_id: getVisitorId(),
        target_domain: siteName || targetUrl,
        ...captureAndGetUtm()
      };
      const endpoint = '/api/track';
      
      let isSent = false;
      if (navigator.sendBeacon) {
        isSent = navigator.sendBeacon(endpoint, new Blob([JSON.stringify(payload)], { type: 'application/json' }));
      }
      if (!isSent) {
        fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }).catch(() => {});
      }

      setTimeout(() => {
        if (targetUrl && targetUrl !== '#') window.location.href = targetUrl;
        else alert('该平台暂未配置有效的跳转链接。');
      }, 150);
    }

    document.addEventListener('DOMContentLoaded', () => {
      captureAndGetUtm();
      renderFrontend();
    });
  </script>
</body>
</html>

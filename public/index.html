<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精选导航推荐</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-6 text-slate-800">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 my-auto border border-slate-200/60">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-lg shadow-blue-500/30 mb-3">
        🚀
      </div>
      <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">为您推荐的精选服务</h1>
      <p class="text-xs text-slate-400 mt-1">点击下方卡片即可直接跳转官方链接</p>
    </div>

    <!-- 动态渲染的站点列表容器 -->
    <div id="siteList" class="space-y-3.5">
      <div class="text-center text-slate-400 py-8 text-sm">正在获取站点列表...</div>
    </div>
  </div>

  <script>
    const baseUrl = window.location.origin;

    // 1. 获取或生成唯一的 Visitor ID
    function getVisitorId() {
      let vid = localStorage.getItem('user_visitor_id');
      if (!vid) {
        vid = 'vid_' + Math.random().toString(36).substr(2, 8) + '_' + Date.now().toString().slice(-6);
        localStorage.setItem('user_visitor_id', vid);
      }
      return vid;
    }

    // 2. 抓取与锁定 UTM 渠道参数（同时兼容 source/utm_source 格式）
    function captureAndGetUtm() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlSource = urlParams.get('source') || urlParams.get('utm_source');
      const urlCampaign = urlParams.get('campaign') || urlParams.get('utm_campaign');

      if (urlSource) sessionStorage.setItem('current_utm_source', urlSource);
      if (urlCampaign) sessionStorage.setItem('current_utm_campaign', urlCampaign);

      const source = urlSource || sessionStorage.getItem('current_utm_source') || 'direct';
      const campaign = urlCampaign || sessionStorage.getItem('current_utm_campaign') || 'none';

      return { source, campaign };
    }

    // 3. 页面初始化
    window.onload = () => {
      captureAndGetUtm();
      fetchWebsites();
    };

    async function fetchWebsites() {
      try {
        const res = await fetch(`${baseUrl}/api/websites`);
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          renderSites(json.data);
        } else {
          document.getElementById('siteList').innerHTML = '<div class="text-center text-slate-400 py-6 text-sm">暂无配置站点</div>';
        }
      } catch (err) {
        document.getElementById('siteList').innerHTML = '<div class="text-center text-red-400 py-6 text-sm">加载失败，请刷新重试</div>';
      }
    }

    function renderSites(sites) {
      const container = document.getElementById('siteList');
      container.innerHTML = sites.map(site => `
        <div data-id="${site.id}" 
             data-name="${encodeURIComponent(site.name)}" 
             data-url="${encodeURIComponent(site.url)}" 
             class="site-card group bg-slate-50 hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200/80 hover:border-blue-400 transition-all cursor-pointer flex items-center justify-between">
          <div class="flex items-center space-x-3.5">
            <img src="${site.icon_url || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + site.id}" 
                 class="w-11 h-11 rounded-xl object-cover bg-white shadow-sm">
            <div>
              <h3 class="font-bold text-slate-800 text-sm group-hover:text-blue-600 transition-colors">${site.name}</h3>
              <p class="text-slate-500 text-xs mt-0.5 line-clamp-1">${site.desc_text || '点击进入官方网站'}</p>
            </div>
          </div>
          <div class="w-8 h-8 rounded-full bg-white group-hover:bg-blue-600 flex items-center justify-center text-slate-400 group-hover:text-white transition-all shadow-sm">
            ➔
          </div>
        </div>
      `).join('');

      // 点击事件注册
      document.querySelectorAll('.site-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.getAttribute('data-id');
          const name = decodeURIComponent(card.getAttribute('data-name'));
          const url = decodeURIComponent(card.getAttribute('data-url'));
          trackAndRedirect(id, name, url);
        });
      });
    }

    // 4. 点击记录与无感跳转（已修正接口路径与字段对齐）
    function trackAndRedirect(siteId, siteName, targetUrl) {
      const visitorId = getVisitorId();
      const { source, campaign } = captureAndGetUtm();

      // 严格对齐后端要求的参数结构
      const payload = {
        visitor_id: visitorId,
        target_domain: targetUrl,
        source: source,
        campaign: campaign
      };

      // 修正请求路径为正确的 /api/track
      fetch(`${baseUrl}/api/track`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(err => console.error('Track error:', err));

      window.open(targetUrl, '_blank');
    }
  </script>
</body>
</html>
